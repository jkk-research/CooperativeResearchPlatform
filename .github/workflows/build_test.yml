name: Build test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy

    steps:
      # ✅ Checkout the repository (without submodules yet)
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Create workspace
      - name: Create a ROS2 workspace
        run: mkdir -p ros2_ws/src

      # ✅ Allow git commands in the container environment
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      # ✅ Pull the core submodules (all public, over HTTPS)
      - name: Pull submodules
        run: git submodule update --init --recursive

      # ✅ Copy source packages into workspace
      - name: Copy packages to workspace
        run: cp -r crp_APL crp_SIL launch ros2_ws/src

      # ✅ Install ROS 2 package dependencies (Autoware message packages come from apt)
      - name: Install dependencies
        shell: bash
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      # ✅ Build the ROS 2 workspace
      - name: Build the workspace
        shell: bash
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          colcon build
